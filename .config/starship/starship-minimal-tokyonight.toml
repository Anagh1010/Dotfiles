add_newline = true
command_timeout = 5000

# Explicit layout order: Left side modules followed by right side duration
format = """$directory$git_branch$git_status\
$c$cpp$rust$golang$nodejs$php$java$kotlin$haskell$python$docker_context\
$line_break$character"""
right_format = "$cmd_duration"

[directory]
style = "fg:#bb9af7"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = " "
style = "fg:#73daca"
format = 'on [$symbol$branch]($style) '

[git_status]
style = "fg:#ff9e64"
format = '([\[$all_status$ahead_behind\]]($style) )'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[ ❯](fg:#9ece6a)'
error_symbol = '[ ❯](fg:#f7768e)'

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:#e0af68"
format = "[took ](fg:crust)[$duration]($style)"

# ==========================================
# LANGUAGE INDICATORS (TokyoNight Palette)
# ==========================================

[c]
symbol = " "
style = "fg:#7dcfff"
format = 'via [$symbol($version )]($style)'

[cpp]
symbol = " "
style = "fg:#7dcfff"
format = 'via [$symbol($version )]($style)'

[rust]
symbol = " "
style = "fg:#ff9e64"
format = 'via [$symbol($version )]($style)'

[nodejs]
symbol = " "
style = "fg:#e0af68"
format = 'via [$symbol($version )]($style)'

[java]
symbol = " "
style = "fg:#f7768e"
format = 'via [$symbol($version )]($style)'

[python]
symbol = " "
style = "fg:#e0af68"
format = 'via [$symbol($version )(\($virtualenv\) )]($style)'

[docker_context]
symbol = " "
style = "fg:#7aa2f7"
format = 'outside [$symbol($context )]($style)'
