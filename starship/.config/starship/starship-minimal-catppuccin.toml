add_newline = true
command_timeout = 5000
palette = "catppuccin"

# Explicit layout order: Left side modules followed by right side duration
format = """$directory$git_branch$git_status\
$c$cpp$rust$golang$nodejs$php$java$kotlin$haskell$python$docker_context\
$line_break$character"""
right_format = "$cmd_duration"

# Define Catppuccin Palette Variables (Registered under a specific name string)
[palettes.catppuccin]
ct_rosewater = "#f5e0dc"
ct_flamingo  = "#f2cdcd"
ct_pink      = "#f5c2e7"
ct_mauve     = "#cba6f7"
ct_red       = "#f38ba8"
ct_maroon    = "#eba0ac"
ct_peach     = "#fab387"
ct_yellow    = "#f9e2af"
ct_green     = "#a6e3a1"
ct_teal      = "#94e2d5"
ct_sky       = "#89dceb"
ct_sapphire  = "#74c7ec"
ct_blue      = "#89b4fa"
ct_lavender  = "#b4befe"
ct_subtext1  = "#bac2de"
ct_subtext0  = "#a6adc8"
ct_overlay2  = "#9399b2"
ct_overlay1  = "#7f849c"
ct_overlay0  = "#6c7086"
ct_surface2  = "#585b70"
ct_surface1  = "#45475a"
ct_surface0  = "#313244"
ct_base      = "#1e1e2e"
ct_mantle    = "#181825"
ct_crust     = "#11111b"

[directory]
style = "bold ct_mauve"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = "bold ct_teal"
format = 'on [$symbol$branch]($style) '

[git_status]
style = "bold ct_peach"
format = '([\[$all_status$ahead_behind\]]($style) )'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[ ❯](bold ct_green)'
error_symbol = '[ ❯](bold ct_red)'

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "bold ct_yellow"
format = "[took ](ct_subtext1)[$duration]($style)"

# ==========================================
# LANGUAGE INDICATORS (Catppuccin Palette)
# ==========================================

[c]
symbol = " "
style = "bold ct_sapphire"
format = 'via [$symbol($version )]($style)'

[cpp]
symbol = " "
style = "bold ct_sky"
format = 'via [$symbol($version )]($style)'

[rust]
symbol = " "
style = "bold ct_peach"
format = 'via [$symbol($version )]($style)'

[golang]
symbol = " "
style = "bold ct_teal"
format = 'via [$symbol($version )]($style)'

[nodejs]
symbol = " "
style = "bold ct_green"
format = 'via [$symbol($version )]($style)'

[php]
symbol = "🐘 "
style = "bold ct_lavender"
format = 'via [$symbol($version )]($style)'

[java]
symbol = " "
style = "bold ct_maroon"
format = 'via [$symbol($version )]($style)'

[kotlin]
symbol = "🅺 "
style = "bold ct_mauve"
format = 'via [$symbol($version )]($style)'

[haskell]
symbol = " "
style = "bold ct_pink"
format = 'via [$symbol($version )]($style)'

[python]
symbol = " "
style = "bold ct_yellow"
format = 'via [$symbol($version )(\($virtualenv\) )]($style)'

[docker_context]
symbol = " "
style = "bold ct_blue"
format = 'outside [$symbol($context )]($style)'
