# ── Prompt ────────────────────────────────────────────────────────────────────
[directory]
style             = "fg:#73dacb"
format            = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = ""
"Pictures" = ""
"projects" = "󰲋"

[git_branch]
symbol = " "
style  = "fg:blue"
format = 'on [$symbol$branch]($style) '

[git_status]
style  = "fg:red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[line_break]
disabled = true
#  ❯
[character]
disabled = false
success_symbol = '[](fg:blue)'
error_symbol = '[](fg:red)'

[cmd_duration]
disabled = true
min_time          = 2000
show_milliseconds = false
style             = "fg:yellow"
format            = "[took ](fg:overlay1)[$duration]($style)"

# ── Languages ─────────────────────────────────────────────────────────────────
[c]
symbol = " "
style = "fg:sky"
format = 'via [$symbol($version )]($style)'

[cpp]
symbol = " "
style = "fg:sky"
format = 'via [$symbol($version )]($style)'

[rust]
symbol = " "
style = "fg:peach"
format = 'via [$symbol($version )]($style)'

[nodejs]
symbol = " "
style = "fg:green"
format = 'via [$symbol($version )]($style)'

[java]
symbol = " "
style = "fg:blue"
format = 'via [$symbol($version )]($style)'

[python]
symbol = " "
style = "fg:yellow"
format = 'via [$symbol($version )(\($virtualenv\) )]($style)'
